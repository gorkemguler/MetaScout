[project]
name = "metascout"
version = "0.1.3"
description = "Open-source, cross-platform document discovery and metadata reconnaissance tool (FOCA alternative)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Görkem Güler" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "jinja2>=3.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "flask>=3.0",
    "ddgs>=9.0",
]

[project.optional-dependencies]
# Opt-in document *content* scanning (--scan-content): looks for PII
# (national ID numbers, emails, phones, IBANs, card numbers, address/DOB
# hints) and signature hints inside downloaded PDFs/Office files, on top of
# the always-on metadata scan. Kept out of the core install since most
# scans don't need it and pypdf/phonenumbers add real weight.
content-scan = [
    "pypdf>=4.0",
    "phonenumbers>=8.13",
]

# Opt-in *visual* signature detection (--visual-signature):
# looks for handwritten-signature-shaped ink blobs in rasterized page images
# (catches a wet signature with no text layer at all), via the unmaintained-
# since-2022 `signature-detect` package. Kept as its own extra, separate
# from content-scan, since it also needs ImageMagick *and* Ghostscript
# installed system-wide (not just this pip package) — see
# content_scan/visual_signature.py and the README for details.
visual-signature = [
    "signature-detect>=0.1.4",
]

# Opt-in OCR fallback for --scan-content: when a PDF page's real text layer
# extracts to (near-)nothing — a scanned/image-only page, e.g. a scanned
# contract or ID card with no text at all — rasterizes that page and OCRs
# it with Tesseract instead, so content scanning (PII/secrets/infra
# detection) isn't blind to scanned documents. Same rasterization technique
# as visual-signature (Wand -> ImageMagick -> Ghostscript), plus Tesseract
# OCR itself — also needs those installed system-wide, not just this pip
# package. Kept as its own extra since it's a materially different
# capability from visual-signature (this feeds text-based detection, that
# one looks at pixels directly) even though the rasterization step is
# shared conceptually. Automatic once installed: no extra CLI flag needed,
# --scan-content just gets better coverage on scanned PDFs.
ocr = [
    "pytesseract>=0.3",
    "Wand>=0.6",
    "Pillow>=10.0",
]

# Opt-in REST API service (`metascout api`): a separate, job-based HTTP
# service (FastAPI + uvicorn) wrapping the same discover -> download ->
# extract -> analyze pipeline as the CLI/web UI, for programmatic/enterprise
# integration — start a scan, poll its status, pull the JSON/HTML report or
# a zip once it's done. Kept out of the core install: most users only need
# the CLI or the local single-user web UI, not a network-facing service.
# No built-in authentication (see api/app.py and the README) — same
# "don't expose this without a reverse proxy in front of it" posture as
# `metascout web`, just written for a machine caller instead of a browser.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
metascout = "metascout.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metascout = ["report/templates/*.jinja"]
