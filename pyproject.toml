[project]
name = "metascout"
version = "0.1.0"
description = "Open-source, cross-platform document discovery and metadata reconnaissance tool (FOCA alternative)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Görkem Güler" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "jinja2>=3.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "flask>=3.0",
]

[project.scripts]
metascout = "metascout.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metascout = ["report/templates/*.jinja"]
